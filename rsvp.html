<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendsgiving RSVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2026e">
    <style>
        .card
        {
            max-width: 480px;
            text-align: left;
        }

        .card h2
        {
            text-align: center;
            font-size: 2.4em;
        }

        label
        {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        select, input[type="text"]
        {
            font-family: 'Montserrat', sans-serif;
            font-size: 1em;
            color: var(--navy);
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            background: #fff;
            border: 2px solid rgba(47, 58, 95, 0.35);
            border-radius: 10px;
        }

        select:focus, input[type="text"]:focus
        {
            outline: none;
            border-color: var(--navy);
        }

        .additional-fields
        {
            display: none;
        }

        .additional-fields.visible
        {
            display: block;
        }

        .attendance-options
        {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
        }

        .attendance-options label
        {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            margin: 0;
            cursor: pointer;
        }

        /* Fixes weird safari radio button issues */
        input[type="radio"]
        {
            width: auto !important;
            margin: 0;
            accent-color: var(--navy);
        }

        .actions
        {
            text-align: center;
        }

        .rsvp-success, .rsvp-error
        {
            text-align: center;
        }

        .rsvp-success p
        {
            font-size: 1.1em;
        }

        .rsvp-error
        {
            color: var(--red);
            font-weight: 600;
        }

        .back-link
        {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: var(--navy-soft);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <form class="card" id="rsvpForm" action="https://formspree.io/f/xoejlkgk" method="POST">
            <h2>RSVP</h2>

            <label for="guests">Select your name(s)</label>
            <select id="guests" name="guests" required onchange="showAdditionalFields()">
                <option value="" disabled selected>Select a guest</option>
                <!-- Remove names from here as people RSVP -->
                <option value="Abby & Dom">Abby &amp; Dom</option>
                <option value="Ayden">Ayden</option>
                <option value="Becky & Kyle">Becky &amp; Kyle</option>
                <option value="Brendon">Brendon</option>
                <option value="Jacob Grass">Jacob Grass</option>
                <option value="Jonah">Jonah</option>
                <option value="Kalahn & Aiden">Kalahn &amp; Aiden</option>
                <option value="Kevin">Kevin</option>
                <option value="Rachel">Rachel</option>
                <option value="Sarah & Chase">Sarah &amp; Chase</option>
            </select>

            <!-- Additional fields for selected guest -->
            <div class="additional-fields">
                <label>Will you be attending?</label>
                <div class="attendance-options">
                    <label for="attendanceYes">
                        <input type="radio" id="attendanceYes" name="attendance" value="Yes"> Yes
                    </label>
                    <label for="attendanceNo">
                        <input type="radio" id="attendanceNo" name="attendance" value="No"> No
                    </label>
                </div>

                <label for="bringing">What will you be bringing?</label>
                <input type="text" id="bringing" name="bringing">
            </div>

            <p class="rsvp-error" hidden>Something went wrong sending your RSVP. Please try again.</p>

            <div class="actions">
                <button type="submit" class="rsvp-button">Submit</button>
            </div>
            <a class="back-link" href="index.html">&larr; Back to invite</a>
        </form>

        <div class="card rsvp-success" hidden>
            <h2>Thanks!</h2>
            <p id="successMessage"></p>
            <p>Taking you back to the invite&hellip;</p>
        </div>
    </div>

    <script>
        function showAdditionalFields()
        {
            const selectedGuest = document.getElementById('guests').value;
            const additionalFields = document.querySelector('.additional-fields');

            if (selectedGuest !== "")
            {
                additionalFields.classList.add('visible');
            }
            else
            {
                additionalFields.classList.remove('visible');
            }
        }

        // Send the RSVP to Formspree in the background, show a thank-you, then go home
        const form = document.getElementById('rsvpForm');
        const submitButton = form.querySelector('button[type="submit"]');
        const errorMessage = form.querySelector('.rsvp-error');

        form.addEventListener('submit', async (event) =>
        {
            event.preventDefault();
            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';
            errorMessage.hidden = true;

            try
            {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok)
                {
                    throw new Error('Formspree returned ' + response.status);
                }

                const name = form.guests.value;
                const attending = form.attendance.value;
                document.getElementById('successMessage').textContent =
                    attending === 'No'
                        ? `Your RSVP was sent, ${name}. Sorry you can't make it!`
                        : `Your RSVP was sent, ${name}. See you on November 13!`;

                form.hidden = true;
                document.querySelector('.rsvp-success').hidden = false;

                setTimeout(() =>
                {
                    window.location.href = 'index.html';
                }, 3000);
            }
            catch (error)
            {
                errorMessage.hidden = false;
                submitButton.disabled = false;
                submitButton.textContent = 'Submit';
            }
        });
    </script>
    <script src="turkeys.js?v=2026e"></script>
</body>
</html>
